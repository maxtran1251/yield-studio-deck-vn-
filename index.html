document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ound:#0E0E0C;color:#F2F1EA;font-family:'Be Vietnam Pro',sans-serif;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;\">\n    <img data-anim=\"fade\" src=\"https://yieldstudio.com/assets/landing/_next/static/media/logo-lime.26cdg9_ktwoqf.svg\" alt=\"Yield Studio\" style=\"height:56px;\">\n    <span style=\"font-size:24px;color:#9A9A90;letter-spacing:0.08em;\">01 / 08<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:80px;align-items:center;flex:1;\">\n    <div style=\"display:flex;flex-direction:column;gap:44px;\">\n      <span data-anim=\"title\" style=\"font-size:28px;color:#D4FF3A;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;animation-delay:.1s;\">Yield Studio là gì?<\u002Fspan>\n      <h1 data-anim=\"title\" style=\"animation-delay:.2s;font-family:'Unbounded',sans-serif;font-weight:700;font-size:84px;line-height:1.08;margin:0;text-wrap:pretty;\">Một workspace cho toàn bộ quy trình từ traffic đến doanh thu<\u002Fh1>\n      <p data-anim=\"title\" style=\"animation-delay:.35s;font-size:34px;line-height:1.45;color:#C9C8BF;margin:0;max-width:960px;text-wrap:pretty;\">Nền tảng monetization <b>all - in - one<\u002Fb> dành cho publisher, content arbitrage và team media buying: Tối ưu hoá quy trình từ dựng site, đăng bài, tích hợp quảng cáo và theo dõi doanh thu ở <b>cùng một nơi.<\u002Fb><\u002Fp>\n    <\u002Fdiv>\n    <img data-anim=\"eye\" src=\"https://yieldstudio.com/assets/landing/_next/static/media/eyeball.3l49axf4_adgc.png\" alt=\"\" style=\"width:100%;max-height:520px;object-fit:contain;\">\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:12px;\">\n    <div data-anim=\"step\" style=\"animation-delay:0.8s;border-top:4px solid #D4FF3A;padding-top:18px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:24px;color:#D4FF3A;\">№1<\u002Fspan><span style=\"font-size:28px;font-weight:600;\">Dựng site<\u002Fspan><\u002Fdiv>\n    <div data-anim=\"step\" style=\"animation-delay:0.9s;border-top:4px solid #D4FF3A;padding-top:18px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:24px;color:#D4FF3A;\">№2<\u002Fspan><span style=\"font-size:28px;font-weight:600;\">Đăng nội dung<\u002Fspan><\u002Fdiv>\n    <div data-anim=\"step\" style=\"animation-delay:1.0s;border-top:4px solid #D4FF3A;padding-top:18px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:24px;color:#D4FF3A;\">№3<\u002Fspan><span style=\"font-size:28px;font-weight:600;\">Gắn tracking<\u002Fspan><\u002Fdiv>\n    <div data-anim=\"step\" style=\"animation-delay:1.1s;border-top:4px solid #D4FF3A;padding-top:18px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:24px;color:#D4FF3A;\">№4<\u002Fspan><span style=\"font-size:28px;font-weight:600;\">Kéo traffic<\u002Fspan><\u002Fdiv>\n    <div data-anim=\"step\" style=\"animation-delay:1.2s;border-top:4px solid #D4FF3A;padding-top:18px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:24px;color:#D4FF3A;\">№5<\u002Fspan><span style=\"font-size:28px;font-weight:600;\">Bật quảng cáo<\u002Fspan><\u002Fdiv>\n    <div data-anim=\"step\" style=\"animation-delay:1.3s;border-top:4px solid #D4FF3A;padding-top:18px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:24px;color:#D4FF3A;\">№6<\u002Fspan><span style=\"font-size:28px;font-weight:600;\">Theo dõi RPM<\u002Fspan><\u002Fdiv>\n    <div data-anim=\"step\" style=\"animation-delay:1.4s;border-top:4px solid #D4FF3A;padding-top:18px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:24px;color:#D4FF3A;\">№7<\u002Fspan><span style=\"font-size:28px;font-weight:600;\">Tăng trưởng<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"02 Khó khăn\" data-speaker-notes=\"Những khó khăn publisher content arbitrage gặp khi tự vận hành nhiều hệ thống rời rạc.\" style=\"background:#FFFFFF;color:#1F2A1F;font-family:'Be Vietnam Pro',sans-serif;padding:80px 80px 72px;box-sizing:border-box;display:flex;flex-direction:column;gap:36px;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;\">\n    <h2 data-anim=\"title\" style=\"animation-delay:0.1s;font-family:'Anton',sans-serif;font-weight:400;font-size:110px;line-height:1;margin:0;text-transform:uppercase;\">Khó khăn của publisher<\u002Fh2>\n    <span style=\"font-size:24px;letter-spacing:0.08em;color:#5A6457;\">02 / 08<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:28px;flex:1;\">\n    <div data-anim=\"cell\" style=\"animation-delay:0.30s;background:#EEF9FD;border:2px solid #A8E3F3;border-radius:28px;padding:36px;display:flex;flex-direction:column;gap:16px;\">\n      <span style=\"width:68px;height:68px;border-radius:50%;border:2px solid #1F2A1F;background:linear-gradient(135deg,#9EE3F6,#CBF04B);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\">№1<\u002Fspan>\n      <span style=\"font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.2;\">SET UP SITE TỐN THỜI GIAN<\u002Fspan>\n      <span style=\"font-size:28px;line-height:1.4;color:#33402F;text-wrap:pretty;\">2–4 ngày/tên miền: DNS, SSL, WordPress + ít nhất 12 plugin, tracking thủ công.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:0.42s;background:#EEF9FD;border:2px solid #A8E3F3;border-radius:28px;padding:36px;display:flex;flex-direction:column;gap:16px;\">\n      <span style=\"width:68px;height:68px;border-radius:50%;border:2px solid #1F2A1F;background:linear-gradient(135deg,#9EE3F6,#CBF04B);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\">№2<\u002Fspan>\n      <span style=\"font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Monetization rời rạc<\u002Fspan>\n      <span style=\"font-size:28px;line-height:1.4;color:#33402F;text-wrap:pretty;\">Phụ thuộc một mạng quảng cáo, bố cục quảng cáo ko tối ưu, nguy cơ bị gắn cờ và khấu trừ invalid traffic<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:0.54s;background:#EEF9FD;border:2px solid #A8E3F3;border-radius:28px;padding:36px;display:flex;flex-direction:column;gap:16px;\">\n      <span style=\"width:68px;height:68px;border-radius:50%;border:2px solid #1F2A1F;background:linear-gradient(135deg,#9EE3F6,#CBF04B);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\">№3<\u002Fspan>\n      <span style=\"font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Test vertical mới chậm<\u002Fspan>\n      <span style=\"font-size:28px;line-height:1.4;color:#33402F;text-wrap:pretty;\">Tốn thời gian set up lại khi cần triển khai topic, key, nội dung mới. Quy trình ko tối ưu khi nhân rộng quy mô.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:0.66s;background:#EEF9FD;border:2px solid #A8E3F3;border-radius:28px;padding:36px;display:flex;flex-direction:column;gap:16px;\">\n      <span style=\"width:68px;height:68px;border-radius:50%;border:2px solid #1F2A1F;background:linear-gradient(135deg,#9EE3F6,#CBF04B);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\">№4<\u002Fspan>\n      <span style=\"font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Khó quản lý team media buying<\u002Fspan>\n      <span style=\"font-size:28px;line-height:1.4;color:#33402F;text-wrap:pretty;\">Buyer cần gắn pixel, tạo landing mà không chạm cấu hình nhạy cảm.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:0.78s;background:#EEF9FD;border:2px solid #A8E3F3;border-radius:28px;padding:36px;display:flex;flex-direction:column;gap:16px;\">\n      <span style=\"width:68px;height:68px;border-radius:50%;border:2px solid #1F2A1F;background:linear-gradient(135deg,#9EE3F6,#CBF04B);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\">№5<\u002Fspan>\n      <span style=\"font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Sản xuất nội dung bị nghẽn<\u002Fspan>\n      <span style=\"font-size:28px;line-height:1.4;color:#33402F;text-wrap:pretty;\">Content team phụ thuộc vào dev trong khi set up kĩ thuật.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:0.90s;background:#EEF9FD;border:2px solid #A8E3F3;border-radius:28px;padding:36px;display:flex;flex-direction:column;gap:16px;\">\n      <span style=\"width:68px;height:68px;border-radius:50%;border:2px solid #1F2A1F;background:linear-gradient(135deg,#9EE3F6,#CBF04B);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;\">№6<\u002Fspan>\n      <span style=\"font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Quyết định theo cảm tính<\u002Fspan>\n      <span style=\"font-size:28px;line-height:1.4;color:#33402F;text-wrap:pretty;\">Thiếu dữ liệu RPM theo site, bài viết, chủ đề để biết nên scale hay dừng.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"03 Lợi ích\" data-speaker-notes=\"Lợi ích của Yield Studio: toàn bộ quy trình trong một workspace.\" style=\"background:#FFFFFF;color:#1F2A1F;font-family:'Be Vietnam Pro',sans-serif;padding:0;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"padding:72px 80px 48px;display:flex;justify-content:space-between;align-items:flex-end;\">\n    <h2 data-anim=\"title\" style=\"font-family:'Anton',sans-serif;font-weight:400;font-size:132px;line-height:1;margin:0;text-transform:uppercase;\">Lợi ích của Yield Studio<\u002Fh2>\n    <span style=\"font-size:24px;letter-spacing:0.08em;color:#5A6457;\">03 / 08<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr 1fr;flex:1;border-top:2px solid #1F2A1F;min-height:0;\">\n    <div data-anim=\"cell\" style=\"background:#E3F6FD;border-right:2px solid #1F2A1F;padding:36px 40px;display:flex;flex-direction:column;gap:18px;min-height:0;animation-delay:0.25s;\">\n      <span style=\"font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Launch site dưới 2 phút<\u002Fspan>\n      <img src=\"https://yieldstudio.com/assets/landing/_next/static/media/features1.1qivyv2nw6imu.jpg\" alt=\"\" style=\"width:100%;height:150px;object-fit:cover;object-position:top;border-radius:8px;\">\n      <span style=\"font-size:24px;line-height:1.4;text-wrap:pretty;\">Tạo tên miền, tên miền phụ, nội dung, trang tĩnh — hosting, SSL do yied studio cung cấp.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"border-right:2px solid #1F2A1F;padding:36px 40px;display:flex;flex-direction:column;gap:18px;min-height:0;animation-delay:0.37s;\">\n      <span style=\"font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Đăng bài, AI hỗ trợ<\u002Fspan>\n      <img src=\"https://yieldstudio.com/assets/landing/_next/static/media/features2.0y57_yvjlqsry.jpg\" alt=\"\" style=\"width:100%;height:150px;object-fit:cover;object-position:top;border-radius:8px;\">\n      <span style=\"font-size:24px;line-height:1.4;text-wrap:pretty;\">Tạo, sửa, xuất bản nhanh; AI gợi ý chủ đề, con người duyệt bài.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"border-right:2px solid #1F2A1F;padding:36px 40px;display:flex;flex-direction:column;gap:18px;min-height:0;animation-delay:0.49s;\">\n      <span style=\"font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Kiếm tiền từ nhiều nguồn<\u002Fspan>\n      <img src=\"https://yieldstudio.com/assets/landing/_next/static/media/features3.1sl2qovgkq06h.jpg\" alt=\"\" style=\"width:100%;height:150px;object-fit:cover;object-position:top;border-radius:8px;\">\n      <span style=\"font-size:24px;line-height:1.4;text-wrap:pretty;\">Google programmatic, native MGID và video — bố cục cấu hình sẵn.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"border-right:2px solid #1F2A1F;padding:36px 40px;display:flex;flex-direction:column;gap:18px;min-height:0;animation-delay:0.61s;\">\n      <span style=\"font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Gắn tracking không cần dev<\u002Fspan>\n      <img src=\"https://yieldstudio.com/assets/landing/_next/static/media/features4.09kkizqh7qobi.jpg\" alt=\"\" style=\"width:100%;height:150px;object-fit:cover;object-position:top;border-radius:8px;\">\n      <span style=\"font-size:24px;line-height:1.4;text-wrap:pretty;\">Meta Pixel, TikTok, GA, GTM, postback S2S (Voluum, RedTrack, Binom).<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"border-right:2px solid #1F2A1F;border-top:2px solid #1F2A1F;padding:36px 40px;display:flex;flex-direction:column;gap:18px;min-height:0;animation-delay:0.73s;\">\n      <span style=\"font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Tự động setup kỹ thuật<\u002Fspan>\n      <img src=\"https://yieldstudio.com/assets/landing/_next/static/media/features5.0jzdolvp5choe.jpg\" alt=\"\" style=\"width:100%;height:150px;object-fit:cover;object-position:top;border-radius:8px;\">\n      <span style=\"font-size:24px;line-height:1.4;text-wrap:pretty;\">ads.txt động, CMP (GDPR / US Privacy), trang pháp lý trong một checklist.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"border-right:2px solid #1F2A1F;border-top:2px solid #1F2A1F;padding:36px 40px;display:flex;flex-direction:column;gap:18px;min-height:0;animation-delay:0.85s;\">\n      <span style=\"font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Phân quyền theo vai trò<\u002Fspan>\n      <img src=\"https://yieldstudio.com/assets/landing/_next/static/media/features6.0e_9i4x847jzt.jpg\" alt=\"\" style=\"width:100%;height:150px;object-fit:cover;object-position:top;border-radius:8px;\">\n      <span style=\"font-size:24px;line-height:1.4;text-wrap:pretty;\">Mỗi vai trò có quyền riêng; thiết lập nhạy cảm chỉ mở khi cần.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"background:#E3F6FD;border-right:2px solid #1F2A1F;border-top:2px solid #1F2A1F;padding:36px 40px;display:flex;flex-direction:column;gap:18px;min-height:0;animation-delay:0.97s;\">\n      <span style=\"font-size:28px;font-weight:700;text-transform:uppercase;line-height:1.2;\">Theo dõi Revenue, RPM, CPM<\u002Fspan>\n      <img src=\"https://yieldstudio.com/assets/landing/_next/static/media/features7.2cjow64ymh9gs.jpg\" alt=\"\" style=\"width:100%;height:150px;object-fit:cover;object-position:top;border-radius:8px;\">\n      <span style=\"font-size:24px;line-height:1.4;text-wrap:pretty;\">Theo site, bài viết, nguồn traffic, quốc gia và thiết bị trong một giao diện đơn giản.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid #1F2A1F;display:flex;align-items:center;justify-content:center;padding:32px;\">\n      <img data-anim=\"stamp\" src=\"https://yieldstudio.com/assets/landing/_next/static/media/stamp-card.3rfhg48l9-0on.svg\" alt=\"All of this — from one workspace\" style=\"max-width:100%;max-height:340px;transform:rotate(-6deg);\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"04 So sánh\" data-speaker-notes=\"Phần lớn giải pháp chỉ xử lý một khâu. So sánh hệ thống truyền thống (WordPress + plugin) với Yield Studio theo số liệu từ one-pager.\" style=\"background:#FFFFFF;color:#1F2A1F;font-family:'Be Vietnam Pro',sans-serif;padding:80px 80px 72px;box-sizing:border-box;display:flex;flex-direction:column;gap:32px;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;\">\n    <h2 data-anim=\"title\" style=\"animation-delay:.1s;font-family:'Anton',sans-serif;font-weight:400;font-size:110px;line-height:1;margin:0;text-transform:uppercase;\">CMS TRUYỀN THỐNG VS YIELD STUDIO<\u002Fh2>\n    <span style=\"font-size:24px;letter-spacing:0.08em;color:#5A6457;\">04 / 08<\u002Fspan>\n  <\u002Fdiv>\n  <div data-anim=\"fade\" style=\"animation-delay:.3s;display:flex;flex-wrap:wrap;gap:14px;align-items:center;\">\n    <span style=\"font-size:26px;padding:12px 26px;border:2px solid #1F2A1F;border-radius:999px;background:#EEF9FD;\">CMS: chỉ lo nội dung<\u002Fspan><span style=\"font-size:26px;padding:12px 26px;border:2px solid #1F2A1F;border-radius:999px;background:#EEF9FD;\">Mạng quảng cáo: chỉ lo doanh thu<\u002Fspan><span style=\"font-size:26px;padding:12px 26px;border:2px solid #1F2A1F;border-radius:999px;background:#EEF9FD;\">WordPress: phụ thuộc plugin<\u002Fspan>\n    <span style=\"font-size:36px;line-height:1;color:#1F2A1F;\">→<\u002Fspan>\n    <span data-anim=\"pop\" style=\"animation-delay:.7s;display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;background:#1F2A1F;color:#CBF04B;padding:16px 32px;border-radius:999px;box-shadow:6px 6px 0 #CBF04B;\"><span style=\"font-size:32px;line-height:1;\">★<\u002Fspan>Yield Studio hợp nhất &amp; đơn giản hoá cả quy trình<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;flex:1;min-height:0;border-top:2px solid #1F2A1F;\">\n    <div data-anim=\"cell\" style=\"animation-delay:.4s;display:grid;grid-template-columns:340px 0.75fr 1.25fr;height:72px;border-bottom:2px solid #1F2A1F;\">\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;font-size:24px;color:#5A6457;text-transform:uppercase;letter-spacing:0.06em;\">Tiêu chí<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;font-size:24px;color:#5A6457;text-transform:uppercase;letter-spacing:0.06em;\">Hệ thống truyền thống<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;background:#1F2A1F;color:#CBF04B;\">Yield Studio<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:0.55s;display:grid;grid-template-columns:340px 0.75fr 1.25fr;flex:1;border-bottom:2px solid #1F2A1F;\">\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;font-weight:700;text-transform:uppercase;font-size:26px;\">Thời gian triển khai<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;color:#7A8476;font-size:28px;\">2–4 ngày / tên miền<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;background:#CBF04B;font-family:'Unbounded',sans-serif;font-weight:700;font-size:32px;justify-content:space-between;gap:20px;\"><span style=\"display:flex;align-items:center;gap:16px;\"><span style=\"font-size:34px;line-height:1;\">★<\u002Fspan><span>Dưới 2 phút / tên miền<\u002Fspan><\u002Fspan><span data-anim=\"pop\" style=\"animation-delay:1.20s;font-family:'Be Vietnam Pro',sans-serif;font-size:24px;font-weight:700;white-space:nowrap;background:#1F2A1F;color:#CBF04B;padding:10px 20px;border-radius:999px;\">1.000x+ nhanh hơn<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:0.67s;display:grid;grid-template-columns:340px 0.75fr 1.25fr;flex:1;border-bottom:2px solid #1F2A1F;\">\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;font-weight:700;text-transform:uppercase;font-size:26px;\">Tổng chi phí sở hữu<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;color:#7A8476;font-size:28px;\">750–3.000+ USD / tháng<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;background:#CBF04B;font-family:'Unbounded',sans-serif;font-weight:700;font-size:32px;justify-content:space-between;gap:20px;\"><span style=\"display:flex;align-items:center;gap:16px;\"><span style=\"font-size:34px;line-height:1;\">★<\u002Fspan><span>0 USD ban đầu<\u002Fspan><\u002Fspan><span data-anim=\"pop\" style=\"animation-delay:1.35s;font-family:'Be Vietnam Pro',sans-serif;font-size:24px;font-weight:700;white-space:nowrap;background:#1F2A1F;color:#CBF04B;padding:10px 20px;border-radius:999px;\">Tiết kiệm đến 3.000 USD/th<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:0.79s;display:grid;grid-template-columns:340px 0.75fr 1.25fr;flex:1;border-bottom:2px solid #1F2A1F;\">\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;font-weight:700;text-transform:uppercase;font-size:26px;\">PageSpeed di động<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;color:#7A8476;font-size:28px;\">30–60 điểm<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;background:#CBF04B;font-family:'Unbounded',sans-serif;font-weight:700;font-size:32px;justify-content:space-between;gap:20px;\"><span style=\"display:flex;align-items:center;gap:16px;\"><span style=\"font-size:34px;line-height:1;\">★<\u002Fspan><span>91–100 điểm<\u002Fspan><\u002Fspan><span data-anim=\"pop\" style=\"animation-delay:1.50s;font-family:'Be Vietnam Pro',sans-serif;font-size:24px;font-weight:700;white-space:nowrap;background:#1F2A1F;color:#CBF04B;padding:10px 20px;border-radius:999px;\">Gấp ~2x<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:0.91s;display:grid;grid-template-columns:340px 0.75fr 1.25fr;flex:1;border-bottom:2px solid #1F2A1F;\">\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;font-weight:700;text-transform:uppercase;font-size:26px;\">Tốc độ tải (FCP)<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;color:#7A8476;font-size:28px;\">4,3 giây<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;background:#CBF04B;font-family:'Unbounded',sans-serif;font-weight:700;font-size:32px;justify-content:space-between;gap:20px;\"><span style=\"display:flex;align-items:center;gap:16px;\"><span style=\"font-size:34px;line-height:1;\">★<\u002Fspan><span>0,8 giây<\u002Fspan><\u002Fspan><span data-anim=\"pop\" style=\"animation-delay:1.65s;font-family:'Be Vietnam Pro',sans-serif;font-size:24px;font-weight:700;white-space:nowrap;background:#1F2A1F;color:#CBF04B;padding:10px 20px;border-radius:999px;\">Nhanh hơn 5x<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"cell\" style=\"animation-delay:1.03s;display:grid;grid-template-columns:340px 0.75fr 1.25fr;flex:1;border-bottom:2px solid #1F2A1F;\">\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;font-weight:700;text-transform:uppercase;font-size:26px;\">RPM<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;color:#7A8476;font-size:28px;\">8–25 USD · một mạng quảng cáo<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.3;padding:0 32px;display:flex;align-items:center;background:#CBF04B;font-family:'Unbounded',sans-serif;font-weight:700;font-size:32px;justify-content:space-between;gap:20px;\"><span style=\"display:flex;align-items:center;gap:16px;\"><span style=\"font-size:34px;line-height:1;\">★<\u002Fspan><span>25–40+ USD · đa nguồn<\u002Fspan><\u002Fspan><span data-anim=\"pop\" style=\"animation-delay:1.80s;font-family:'Be Vietnam Pro',sans-serif;font-size:24px;font-weight:700;white-space:nowrap;background:#1F2A1F;color:#CBF04B;padding:10px 20px;border-radius:999px;\">Gấp ~2x<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"05 Phân vai\" data-speaker-notes=\"Publisher chỉ cần tập trung vào traffic; phần kỹ thuật và monetization do Yield Studio lo.\" style=\"background:#F2F1EA;color:#0E0E0C;font-family:'Be Vietnam Pro',sans-serif;padding:80px 100px 72px;box-sizing:border-box;display:flex;flex-direction:column;gap:36px;\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;\">\n    <span data-anim=\"fade\" style=\"font-size:28px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5A5A52;\">Phân vai<\u002Fspan>\n    <span style=\"font-size:24px;color:#5A5A52;letter-spacing:0.08em;\">05 / 08<\u002Fspan>\n  <\u002Fdiv>\n  <h2 data-anim=\"title\" style=\"animation-delay:0.1s;font-family:'Unbounded',sans-serif;font-weight:700;font-size:72px;line-height:1.1;margin:0;text-wrap:pretty;\">Vậy publisher cần làm gì?<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1;min-height:0;\">\n    <div data-anim=\"left\" style=\"animation-delay:.3s;border:2px solid #0E0E0C;border-radius:28px;padding:44px;display:flex;flex-direction:column;gap:28px;\">\n      <span style=\"font-family:'Unbounded',sans-serif;font-size:40px;font-weight:700;\">Publisher làm<\u002Fspan>\n      <div data-anim=\"title\" style=\"animation-delay:0.70s;display:flex;gap:24px;align-items:flex-start;\"><span style=\"font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700;min-width:56px;\">01<\u002Fspan><span style=\"font-size:32px;line-height:1.4;\">Tìm và đẩy nguồn traffic, chủ đề và GEO tiềm năng<\u002Fspan><\u002Fdiv>\n      <div data-anim=\"title\" style=\"animation-delay:0.82s;display:flex;gap:24px;align-items:flex-start;\"><span style=\"font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700;min-width:56px;\">02<\u002Fspan><span style=\"font-size:32px;line-height:1.4;\">Nghiên cứu nội dung, chủ đề, ngách hiệu quả, sáng tạo bài viết.<\u002Fspan><\u002Fdiv>\n      <div data-anim=\"title\" style=\"animation-delay:0.94s;display:flex;gap:24px;align-items:flex-start;\"><span style=\"font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700;min-width:56px;\">03<\u002Fspan><span style=\"font-size:32px;line-height:1.4;\">Theo dõi số liệu RPM, doanh thu, quyết định scale hoặc dừng.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-anim=\"right\" style=\"animation-delay:.45s;background:#0E0E0C;color:#F2F1EA;border-radius:28px;padding:44px;display:flex;flex-direction:column;gap:28px;\">\n      <span style=\"font-family:'Unbounded',sans-serif;font-size:40px;font-weight:700;color:#D4FF3A;\">Yield Studio làm<\u002Fspan>\n      <div data-anim=\"title\" style=\"animation-delay:0.85s;display:flex;gap:24px;align-items:flex-start;\"><span style=\"font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700;min-width:56px;\">01<\u002Fspan><span style=\"font-size:32px;line-height:1.4;\">Set up kĩ thuật, cung cấp domain, hosting, giao diện làm việc.<\u002Fspan><\u002Fdiv>\n      <div data-anim=\"title\" style=\"animation-delay:0.97s;display:flex;gap:24px;align-items:flex-start;\"><span style=\"font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700;min-width:56px;\">02<\u002Fspan><span style=\"font-size:32px;line-height:1.4;\">Kiếm tiền từ quảng cáo: bố cục, ad network, ads.txt — tối ưu bằng AI, tuân thủ chính sách Google.<\u002Fspan><\u002Fdiv>\n      <div data-anim=\"title\" style=\"animation-delay:1.09s;display:flex;gap:24px;align-items:flex-start;\"><span style=\"font-family:'Unbounded',sans-serif;font-size:28px;font-weight:700;min-width:56px;\">03<\u002Fspan><span style=\"font-size:32px;line-height:1.4;\">Tracking &amp; báo cáo RPM, doanh thu theo GEO, bài viết, etc<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anim=\"pop\" style=\"animation-delay:1.4s;background:#D4FF3A;border-radius:999px;padding:30px 56px;font-size:34px;font-weight:600;text-wrap:pretty;\">Yield Studio đơn giản hoá quy trình phức tạp — publisher chỉ cần tập trung phát triển traffic.<\u002Fdiv>
